spring.application.name=fine-service
server.port=8082

# --- Database ---
spring.datasource.url=jdbc:h2:mem:finedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (use this for your final/team version) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/bibliotech_fine?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.hibernate.ddl-auto=update

# --- JWT ---
# MUST match auth-service's jwt.secret exactly, or every request will be rejected.
jwt.secret=bibliotechSuperSecretKeyForJWT2026ChangeThisBeforeSubmission

# --- Fine calculation rule ---
fine.loan-period-days=14
fine.rate-per-day=5.0

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
