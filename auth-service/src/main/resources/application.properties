spring.application.name=auth-service
server.port=8081

# --- Database ---
# Using H2 (in-memory) so you can run this instantly with zero setup.
# Switch to MySQL later by uncommenting the MySQL block and commenting H2 out.
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (use this for your final/team version) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/bibliotech_auth?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.hibernate.ddl-auto=update

# --- JWT ---
# IMPORTANT: this exact string must be copied into fine-service's application.properties too,
# and shared with Surya + Dhanya for Book Service and Rental Service.
jwt.secret=bibliotechSuperSecretKeyForJWT2026ChangeThisBeforeSubmission
jwt.expiration-ms=3600000

# --- Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
